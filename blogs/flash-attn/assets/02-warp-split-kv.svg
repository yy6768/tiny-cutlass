<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">FA1 / split-KV：warp 沿 K 方向切开</text>
  <text x="380" y="53" text-anchor="middle" font-size="12" fill="#64748b">CTA score tile = [64, 64]，WarpCount = 2 × 4，每个 warp 只看到 [32, 16]</text>

  <!-- main score tile -->
  <g id="score-tile">
    <rect x="160" y="95" width="440" height="176" rx="8" fill="url(#tile-bg)" stroke="#dc2626" stroke-width="2"/>

    <!-- K-direction warp columns -->
    <line x1="270" y1="95" x2="270" y2="271" stroke="#dc2626" stroke-width="2.2"/>
    <line x1="380" y1="95" x2="380" y2="271" stroke="#dc2626" stroke-width="2.2"/>
    <line x1="490" y1="95" x2="490" y2="271" stroke="#dc2626" stroke-width="2.2"/>

    <!-- Q-direction warp rows -->
    <line x1="160" y1="183" x2="600" y2="183" stroke="#dc2626" stroke-width="2.2"/>

    <!-- subtle MMA atom grid: each warp has 2x2 atoms -->
    <g stroke="#fecaca" stroke-width="1">
      <line x1="215" y1="95" x2="215" y2="271"/>
      <line x1="325" y1="95" x2="325" y2="271"/>
      <line x1="435" y1="95" x2="435" y2="271"/>
      <line x1="545" y1="95" x2="545" y2="271"/>
      <line x1="160" y1="139" x2="600" y2="139"/>
      <line x1="160" y1="227" x2="600" y2="227"/>
    </g>

    <!-- highlighted complete score row crossing 4 warps -->
    <rect x="160" y="142" width="440" height="24" fill="#fca5a5" fill-opacity="0.86" stroke="#7f1d1d" stroke-width="2"/>
    <line x1="270" y1="142" x2="270" y2="166" stroke="#7f1d1d" stroke-width="1.8"/>
    <line x1="380" y1="142" x2="380" y2="166" stroke="#7f1d1d" stroke-width="1.8"/>
    <line x1="490" y1="142" x2="490" y2="166" stroke="#7f1d1d" stroke-width="1.8"/>

    <!-- warp labels -->
    <g font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">
      <text x="215" y="126">warp 0</text>
      <text x="325" y="126">warp 2</text>
      <text x="435" y="126">warp 4</text>
      <text x="545" y="126">warp 6</text>
      <text x="215" y="216">warp 1</text>
      <text x="325" y="216">warp 3</text>
      <text x="435" y="216">warp 5</text>
      <text x="545" y="216">warp 7</text>
    </g>

    <!-- segment labels on highlighted row -->
    <g font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">
      <text x="215" y="158">16 cols</text>
      <text x="325" y="158">16 cols</text>
      <text x="435" y="158">16 cols</text>
      <text x="545" y="158">16 cols</text>
    </g>

    <!-- dimensions -->
    <path d="M160,286 L600,286" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="380" y="306" text-anchor="middle" font-size="12" fill="#475569">K / S_k 方向：64 columns，被 4 个 warp 切开</text>
    <path d="M135,95 L135,271" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="116" y="185" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 116 185)">Q / S_q 方向：64 rows，被 2 个 warp 切开</text>

    <!-- axis headers -->
    <g font-size="11" fill="#991b1b" text-anchor="middle">
      <text x="215" y="88">warp_KV 0</text>
      <text x="325" y="88">warp_KV 1</text>
      <text x="435" y="88">warp_KV 2</text>
      <text x="545" y="88">warp_KV 3</text>
      <text x="628" y="143">warp_QP 0</text>
      <text x="628" y="231">warp_QP 1</text>
    </g>
  </g>

  <!-- communication consequence -->
  <g id="consequence">
    <text x="380" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">同一行 score 横跨 4 个 warp</text>
    <path d="M205,340 L555,340" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>

    <rect x="120" y="358" width="520" height="48" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="140" y="378" font-size="12" font-weight="700" fill="#7f1d1d">softmax 的 m / l 是整行归约量：</text>
    <text x="140" y="397" font-size="12" fill="#991b1b">没有任何一个 warp 单独拥有完整 64 列，所以 rowmax / rowsum 需要跨 4 warp 通信 + barrier。</text>
  </g>
</svg>


