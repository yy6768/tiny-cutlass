<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="async" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">当前 CUTLASS 版本：K 双 stage，V 单 buffer 的异步 KV pipeline</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#64748b">所有 8 个 warp 都发 cp.async，也都参加 QK / softmax / PV；没有 producer / consumer warp specialization</text>

  <g transform="translate(45 78)">
    <rect width="910" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="14" font-weight="700" fill="#334155">SharedStorage residency</text>
    <g font-size="11" text-anchor="middle">
      <rect x="25" y="41" width="135" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="92" y="62" fill="#1e3a8a">Q：persistent</text>
      <rect x="185" y="41" width="135" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="252" y="62" fill="#166534">K stage 0</text>
      <rect x="330" y="41" width="135" height="34" rx="6" fill="#bbf7d0" stroke="#16a34a"/><text x="397" y="62" fill="#166534">K stage 1</text>
      <rect x="490" y="41" width="115" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="547" y="62" fill="#9a3412">V：single</text>
      <rect x="625" y="41" width="115" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="682" y="62" fill="#92400e">P：single</text>
      <rect x="760" y="41" width="125" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="822" y="62" fill="#991b1b">row max / sum</text>
    </g>
  </g>

  <text x="45" y="208" font-size="14" font-weight="700" fill="#334155">Prologue</text>
  <rect x="135" y="187" width="160" height="42" rx="7" fill="#ede9fe" stroke="#7c3aed"/><text x="215" y="205" text-anchor="middle" font-size="11" fill="#5b21b6">cp.async Q + K0</text><text x="215" y="220" text-anchor="middle" font-size="10" fill="#5b21b6">commit groups</text>
  <path d="M295 208 H345" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="353" y="187" width="112" height="42" rx="7" fill="#e2e8f0" stroke="#64748b"/><text x="409" y="205" text-anchor="middle" font-size="11" fill="#334155">wait&lt;0&gt;</text><text x="409" y="220" text-anchor="middle" font-size="10" fill="#334155">CTA barrier</text>
  <text x="490" y="213" font-size="11" fill="#64748b">Q 与当前 K 对所有 warp 可见</text>

  <rect x="35" y="260" width="930" height="254" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="55" y="287" font-size="15" font-weight="700" fill="#0f172a">KV tile j</text>
  <g font-size="11" text-anchor="middle">
    <rect x="65" y="310" width="145" height="48" rx="7" fill="#ede9fe" stroke="#7c3aed"/><text x="137" y="329" fill="#5b21b6">issue cp.async</text><text x="137" y="346" fill="#5b21b6">Vj + K(j+1)</text>
    <rect x="245" y="310" width="115" height="48" rx="7" fill="#fee2e2" stroke="#dc2626"/><text x="302" y="338" fill="#991b1b">QK(j)</text>
    <rect x="395" y="310" width="150" height="48" rx="7" fill="#fef3c7" stroke="#d97706"/><text x="470" y="329" fill="#92400e">max / exp / sum</text><text x="470" y="346" fill="#92400e">write P + stats</text>
    <rect x="580" y="310" width="120" height="48" rx="7" fill="#e2e8f0" stroke="#64748b"/><text x="640" y="329" fill="#334155">wait V</text><text x="640" y="346" fill="#334155">CTA barrier</text>
    <rect x="735" y="310" width="92" height="48" rx="7" fill="#ffedd5" stroke="#ea580c"/><text x="781" y="338" fill="#9a3412">PV(j)</text>
    <rect x="862" y="310" width="78" height="48" rx="7" fill="#e2e8f0" stroke="#64748b"/><text x="901" y="329" fill="#334155">wait K</text><text x="901" y="346" fill="#334155">flip stage</text>
  </g>
  <g stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
    <path d="M210 334 H237"/><path d="M360 334 H387"/><path d="M545 334 H572"/><path d="M700 334 H727"/><path d="M827 334 H854"/>
  </g>
  <path d="M137 365 C137 430 485 430 485 365" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#async)"/>
  <text x="310" y="421" text-anchor="middle" font-size="11" fill="#6d28d9">Vj copy 与 QK / softmax 重叠</text>
  <path d="M137 372 C137 475 901 475 901 366" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="560" y="468" text-anchor="middle" font-size="11" fill="#166534">K(j+1) 写入另一个 stage；PV 后才 wait&lt;0&gt; 并切换 read_stage</text>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="378" y="385">Bmax</text><text x="562" y="385">BP</text><text x="717" y="385">BV</text><text x="844" y="385">BPV</text><text x="944" y="385">BK</text>
  </g>

  <g transform="translate(35 540)">
    <rect width="930" height="77" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="18" y="25" font-size="13" font-weight="700" fill="#1e3a8a">Barrier 保护的对象</text>
    <text x="18" y="48" font-size="11" fill="#334155">Bmax：四份 row max 可见　　BP：P 与 row sum 可见　　BV：V 的 async copy 对 CTA 可见</text>
    <text x="18" y="66" font-size="11" fill="#334155">BPV：所有 P/V reader 已退出　　BK：下一 K stage 已完成，可安全翻转。全部都是 CTA-wide barrier。</text>
  </g>
</svg>
