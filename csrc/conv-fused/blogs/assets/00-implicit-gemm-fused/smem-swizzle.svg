<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" role="img" aria-labelledby="title desc">
  <title id="title">TensorOp crosswise shared-memory layout</title>
  <desc id="desc">Logical tiles are stored as 128-bit vectors with XOR permutations to reduce bank conflicts.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#18232b}.muted{fill:#5c6970}.panel{fill:#f7f9f8;stroke:#cbd4d2;stroke-width:2}
      .teal{fill:#d9f0ec;stroke:#16857a;stroke-width:2}.amber{fill:#fff0d6;stroke:#d58c1b;stroke-width:2}.red{fill:#fde5e3;stroke:#c75450;stroke-width:2}
      .cell0{fill:#d9f0ec}.cell1{fill:#fff0d6}.cell2{fill:#fde5e3}.cell3{fill:#e8eceb}.grid{stroke:#65736f;stroke-width:1}
      .line{stroke:#18232b;stroke-width:2.3;fill:none}.dash{stroke-dasharray:7 6}
      text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}.h1{font-size:28px;font-weight:700}.h2{font-size:18px;font-weight:700}
      .body{font-size:16px}.small{font-size:13px}.mono{font-family:Consolas,"Cascadia Mono",monospace}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#18232b"/></marker>
  </defs>
  <rect class="bg" width="1300" height="780"/>
  <text class="ink h1" x="46" y="50">shared memory：逻辑 tile 不变，物理地址做 crosswise swizzle</text>
  <text class="muted body" x="46" y="80">Element = fp16，128-bit access = 8 elements，Crosswise = 32，kFactor = 2</text>

  <rect class="panel" x="46" y="112" width="354" height="270" rx="6"/>
  <text class="ink h2" x="68" y="145">两个时段的逻辑 storage（union）</text>
  <rect class="teal" x="70" y="174" width="142" height="78"/><text class="ink body mono" x="91" y="202">A0: 64×96</text><text class="muted small" x="91" y="224">stage0</text><text class="muted small" x="91" y="242">row-major view</text>
  <rect class="amber" x="232" y="174" width="142" height="78"/><text class="ink body mono" x="251" y="202">B0: 96×64</text><text class="muted small" x="251" y="224">stage0</text><text class="muted small" x="251" y="242">column-major view</text>
  <rect class="red" x="151" y="278" width="142" height="78"/><text class="ink body mono" x="166" y="306">B1: 96×128</text><text class="muted small" x="166" y="328">stage1, after wait&lt;0&gt;</text><text class="muted small" x="166" y="346">column-major view</text>
  <text class="muted small" x="70" y="371">96 = 3 stages × K tile 32；不同时常驻</text>

  <path class="line" d="M400 248 H466" marker-end="url(#arrow)"/>
  <rect class="panel" x="470" y="112" width="360" height="270" rx="6"/>
  <text class="ink h2" x="492" y="145">先按 128-bit vector 看地址</text>
  <text class="muted small" x="492" y="169">fundamental tile = 8 × 4 vectors</text>
  <g transform="translate(512 194)">
    <rect class="cell0 grid" x="0" y="0" width="35" height="35"/><rect class="cell0 grid" x="35" y="0" width="35" height="35"/><rect class="cell1 grid" x="70" y="0" width="35" height="35"/><rect class="cell1 grid" x="105" y="0" width="35" height="35"/><rect class="cell2 grid" x="140" y="0" width="35" height="35"/><rect class="cell2 grid" x="175" y="0" width="35" height="35"/><rect class="cell3 grid" x="210" y="0" width="35" height="35"/><rect class="cell3 grid" x="245" y="0" width="35" height="35"/>
    <rect class="cell0 grid" x="0" y="35" width="35" height="35"/><rect class="cell0 grid" x="35" y="35" width="35" height="35"/><rect class="cell1 grid" x="70" y="35" width="35" height="35"/><rect class="cell1 grid" x="105" y="35" width="35" height="35"/><rect class="cell2 grid" x="140" y="35" width="35" height="35"/><rect class="cell2 grid" x="175" y="35" width="35" height="35"/><rect class="cell3 grid" x="210" y="35" width="35" height="35"/><rect class="cell3 grid" x="245" y="35" width="35" height="35"/>
    <rect class="cell1 grid" x="0" y="70" width="35" height="35"/><rect class="cell1 grid" x="35" y="70" width="35" height="35"/><rect class="cell0 grid" x="70" y="70" width="35" height="35"/><rect class="cell0 grid" x="105" y="70" width="35" height="35"/><rect class="cell3 grid" x="140" y="70" width="35" height="35"/><rect class="cell3 grid" x="175" y="70" width="35" height="35"/><rect class="cell2 grid" x="210" y="70" width="35" height="35"/><rect class="cell2 grid" x="245" y="70" width="35" height="35"/>
    <rect class="cell1 grid" x="0" y="105" width="35" height="35"/><rect class="cell1 grid" x="35" y="105" width="35" height="35"/><rect class="cell0 grid" x="70" y="105" width="35" height="35"/><rect class="cell0 grid" x="105" y="105" width="35" height="35"/><rect class="cell3 grid" x="140" y="105" width="35" height="35"/><rect class="cell3 grid" x="175" y="105" width="35" height="35"/><rect class="cell2 grid" x="210" y="105" width="35" height="35"/><rect class="cell2 grid" x="245" y="105" width="35" height="35"/>
  </g>
  <text class="muted small" x="512" y="358">颜色表示 4×4-vector partitions 的交错，不代表转置。</text>

  <path class="line" d="M830 248 H896" marker-end="url(#arrow)"/>
  <rect class="panel" x="900" y="112" width="354" height="270" rx="6"/>
  <text class="ink h2" x="922" y="145">再用两个 XOR 选择物理位置</text>
  <rect class="red" x="922" y="176" width="310" height="72"/>
  <text class="ink small mono" x="940" y="205">p_contiguous_residual</text>
  <text class="ink small mono" x="940" y="226">^ (p_strided_residual % 4)</text>
  <rect class="amber" x="922" y="266" width="310" height="72"/>
  <text class="ink small mono" x="940" y="295">p_contiguous_idx</text>
  <text class="ink small mono" x="940" y="316">^ (p_strided_idx % 2)</text>
  <text class="muted small" x="922" y="365">目的：让同一条 ldmatrix 访问分散到不同 banks。</text>

  <rect class="panel" x="46" y="420" width="1208" height="292" rx="6"/>
  <text class="ink h2" x="70" y="455">这张图应该怎样读</text>
  <rect class="teal" x="72" y="486" width="330" height="164"/>
  <text class="ink body" x="94" y="519">逻辑坐标</text>
  <text class="ink small mono" x="94" y="550">A0(m, k)</text><text class="ink small mono" x="94" y="578">B0(k, n0)</text><text class="ink small mono" x="94" y="606">B1(k, n1)</text>
  <text class="muted small" x="94" y="632">算法和 iterator 看到的矩阵</text>
  <path class="line" d="M402 568 H478" marker-end="url(#arrow)"/>
  <rect class="amber" x="482" y="486" width="330" height="164"/>
  <text class="ink body" x="504" y="519">layout operator()</text>
  <text class="ink small" x="504" y="550">vectorize → partition</text><text class="ink small" x="504" y="578">→ XOR permute</text><text class="ink small" x="504" y="606">→ linear offset</text>
  <text class="muted small" x="504" y="632">只改变 shared-memory 地址</text>
  <path class="line" d="M812 568 H888" marker-end="url(#arrow)"/>
  <rect class="red" x="892" y="486" width="330" height="164"/>
  <text class="ink body" x="914" y="519">Tensor Core load</text>
  <text class="ink small mono" x="914" y="550">ldmatrix → registers</text><text class="ink small mono" x="914" y="578">mma.sync m16n8k16</text>
  <text class="muted small" x="914" y="632">物理存储不是新的数学矩阵</text>
  <text class="muted small" x="70" y="691">SharedStorage0 和 SharedStorage1 位于 union 中；两次 GEMM 的 mainloop storage 按执行阶段复用。</text>
</svg>
